name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Retrieval evaluation (golden questions)
        if: hashFiles('scripts/demo.py') != ''
        run: python -m scripts.demo
